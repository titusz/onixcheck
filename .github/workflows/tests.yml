name: Run Tests

on:
  push:
    branches: [ '**' ]  # Run on all branches
  pull_request:
    branches: [ '**' ]  # Run on PRs targeting any branch
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      run: uv sync --all-extras --dev

    - name: Run tests
      run: uv run pytest

    - name: Build package
      run: uv run python -m build

    - name: Test package installation
      run: |
        uv pip install dist/*.whl
        uv run onixcheck --version

    - name: Minimize uv cache
      run: uv cache prune --ci

  windows-exe:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.12"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      run: uv sync --all-extras --dev

    - name: Build Windows executable
      run: uv run poe build-exe

    - name: Validate sample files with executable
      shell: bash
      run: |
        dist/onixcheck.exe src/onixcheck/data/valid_onix2_ref.xml
        for f in valid_onix3_ref valid_onix3_short valid_onix31_ref valid_onix31_short; do
          dist/onixcheck.exe "src/onixcheck/data/$f.xml" -s xsd rng
        done

    - name: Minimize uv cache
      run: uv cache prune --ci
